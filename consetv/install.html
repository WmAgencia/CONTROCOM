<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Instalador ConsecomTV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at center, #1a1a3a, #000);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .installer {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 60px;
      backdrop-filter: blur(20px);
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #007AFF, #8B5CF6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 40px;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #007AFF, #8B5CF6);
      width: 60%;
      transition: width 0.5s;
      border-radius: 100px;
    }
    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }
    .step {
      text-align: center;
      padding: 24px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .step.completed {
      background: rgba(29, 185, 84, 0.1);
      border-color: rgba(29, 185, 84, 0.3);
    }
    .step.active {
      background: rgba(0, 122, 255, 0.1);
      border-color: rgba(0, 122, 255, 0.3);
    }
    .step-number {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }
    .step.completed .step-number {
      background: #1DB954;
    }
    .step.active .step-number {
      background: #007AFF;
    }
    .step-name {
      font-size: 13px;
      font-weight: 600;
    }
    .status {
      text-align: center;
      padding: 24px;
      background: rgba(0, 122, 255, 0.1);
      border: 1px solid rgba(0, 122, 255, 0.2);
      border-radius: 16px;
      margin-bottom: 30px;
    }
    .status-icon { font-size: 48px; margin-bottom: 16px; }
    .status-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .status-text { font-size: 14px; color: rgba(255, 255, 255, 0.7); }
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #007AFF, #8B5CF6);
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="installer">
    <div class="logo">ConsecomTV</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div class="steps">
      <div class="step completed">
        <div class="step-number">✓</div>
        <div class="step-name">USB Detectado</div>
      </div>
      <div class="step completed">
        <div class="step-number">✓</div>
        <div class="step-name">Sistema OK</div>
      </div>
      <div class="step active">
        <div class="step-number">3</div>
        <div class="step-name">Instalando Apps</div>
      </div>
      <div class="step">
        <div class="step-number">4</div>
        <div class="step-name">Pronto</div>
      </div>
    </div>

    <div class="status">
      <div class="status-icon">📦</div>
      <div class="status-title">Instalando Netflix, YouTube, Disney+...</div>
      <div class="status-text">8 de 12 apps instalados</div>
    </div>

    <button class="btn" onclick="window.location.href='index.html'">Continuar para o launcher</button>
  </div>

  <script>
    let progress = 60;
    const fill = document.getElementById('progress');
    const interval = setInterval(() => {
      progress += 5;
      fill.style.width = progress + '%';
      if (progress >= 100) clearInterval(interval);
    }, 300);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConsecomTV - Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      min-height: 100vh;
      background-image:
        radial-gradient(at 20% 30%, rgba(0, 122, 255, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 70%, rgba(139, 92, 246, 0.3) 0px, transparent 50%);
    }
    .header {
      padding: 40px 60px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #007AFF, #8B5CF6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .time {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.6);
    }
    .hero {
      padding: 20px 60px 40px;
    }
    .hero h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .hero p {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
    }
    .apps {
      padding: 20px 60px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 20px;
    }
    .app {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .app:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .app-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .app-name {
      font-size: 16px;
      font-weight: 600;
    }
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 60px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-item {
      padding: 10px 24px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.3s;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">ConsecomTV</div>
    <div class="time" id="time">--:--</div>
  </div>

  <div class="hero">
    <h1>Bom dia, Wesley</h1>
    <p>Continue assistindo de onde parou</p>
  </div>

  <div class="apps">
    <div class="app" onclick="openApp('netflix')">
      <div class="app-icon" style="background: linear-gradient(135deg, #E50914, #831010);">N</div>
      <div class="app-name">Netflix</div>
    </div>
    <div class="app" onclick="openApp('youtube')">
      <div class="app-icon" style="background: linear-gradient(135deg, #FF0000, #8B0000);">▶</div>
      <div class="app-name">YouTube</div>
    </div>
    <div class="app" onclick="openApp('prime')">
      <div class="app-icon" style="background: linear-gradient(135deg, #00A8E1, #003D5B);">prime</div>
      <div class="app-name">Prime Video</div>
    </div>
    <div class="app" onclick="openApp('disney')">
      <div class="app-icon" style="background: linear-gradient(135deg, #113CCF, #0E1A78);">D+</div>
      <div class="app-name">Disney+</div>
    </div>
    <div class="app" onclick="openApp('globoplay')">
      <div class="app-icon" style="background: linear-gradient(135deg, #F98D2A, #C44F0E);">G</div>
      <div class="app-name">Globoplay</div>
    </div>
    <div class="app" onclick="openApp('hbomax')">
      <div class="app-icon" style="background: linear-gradient(135deg, #6B21A8, #3B0764);">HBO</div>
      <div class="app-name">HBO Max</div>
    </div>
    <div class="app" onclick="openApp('spotify')">
      <div class="app-icon" style="background: linear-gradient(135deg, #1DB954, #0E5C2F);">♪</div>
      <div class="app-name">Spotify</div>
    </div>
    <div class="app" onclick="openApp('twitch')">
      <div class="app-icon" style="background: linear-gradient(135deg, #9146FF, #5A1FB8);">T</div>
      <div class="app-name">Twitch</div>
    </div>
    <div class="app" onclick="openApp('appletv')">
      <div class="app-icon" style="background: linear-gradient(135deg, #2C2C2E, #000);">tv+</div>
      <div class="app-name">Apple TV+</div>
    </div>
    <div class="app" onclick="openApp('paramount')">
      <div class="app-icon" style="background: linear-gradient(135deg, #0064FF, #003C99);">P+</div>
      <div class="app-name">Paramount+</div>
    </div>
    <div class="app" onclick="openApp('pluto')">
      <div class="app-icon" style="background: linear-gradient(135deg, #FF6B00, #B34B00);">pluto</div>
      <div class="app-name">Pluto TV</div>
    </div>
    <div class="app" onclick="openApp('starplus')">
      <div class="app-icon" style="background: linear-gradient(135deg, #273A95, #0F1B57);">★</div>
      <div class="app-name">Star+</div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item">🏠 Início</div>
    <div class="nav-item" onclick="openApp('browser')">🌐 Navegador</div>
    <div class="nav-item" onclick="openApp('files')">📁 Arquivos</div>
    <div class="nav-item" onclick="openApp('settings')">⚙️ Configurações</div>
  </div>

  <script>
    function openApp(app) {
      window.location.href = `apps/${app}.html`;
    }

    function updateTime() {
      const now = new Date();
      const time = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('time').textContent = time;
    }
    updateTime();
    setInterval(updateTime, 60000);
  </script>
</body>
</html>

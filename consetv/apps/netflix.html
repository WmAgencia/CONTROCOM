<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - ConsecomTV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #141414;
      color: #fff;
      min-height: 100vh;
    }
    .header {
      padding: 30px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 32px;
      font-weight: 900;
      color: #E50914;
      letter-spacing: -1px;
    }
    .back {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
    }
    .hero {
      height: 70vh;
      background: linear-gradient(to right, rgba(0,0,0,0.8), transparent), url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=1920') center/cover;
      display: flex;
      align-items: center;
      padding: 0 60px;
    }
    .hero-content { max-width: 600px; }
    .hero h1 { font-size: 64px; margin-bottom: 16px; font-weight: 800; }
    .hero p { font-size: 18px; line-height: 1.5; margin-bottom: 24px; color: rgba(255,255,255,0.8); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 12px;
    }
    .btn-play { background: white; color: black; }
    .btn-info { background: rgba(255,255,255,0.2); color: white; backdrop-filter: blur(10px); }
    .row { padding: 0 60px 30px; }
    .row-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .card {
      aspect-ratio: 16/9;
      background: #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .card:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">NETFLIX</div>
    <a href="../index.html" class="back">← Voltar</a>
  </div>

  <div class="hero">
    <div class="hero-content">
      <h1>Stranger Things</h1>
      <p>Quando um garoto desaparece, uma pequena cidade descobre um mistério envolvendo experimentos secretos, forças sobrenaturais aterrorizantes e uma garotinha muito estranha.</p>
      <button class="btn btn-play">▶ Assistir</button>
      <button class="btn btn-info">� Mais informações</button>
    </div>
  </div>

  <div class="row">
    <div class="row-title">Continuar assistindo</div>
    <div class="cards">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
  </div>

  <div class="row">
    <div class="row-title">Em alta</div>
    <div class="cards">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
  </div>
</body>
</html>

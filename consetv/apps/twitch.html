<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Twitch - ConsecomTV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0E0E10; color: #fff; min-height: 100vh; }
    .header { padding: 30px 60px; display: flex; justify-content: space-between; align-items: center; background: #18181B; border-bottom: 1px solid #2a2a2a; }
    .logo { font-size: 32px; font-weight: 800; color: #9146FF; }
    .back { color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; background: rgba(255,255,255,0.1); }
    .live { padding: 40px 60px; text-align: center; }
    .live h1 { font-size: 48px; margin-bottom: 16px; }
    .live p { font-size: 18px; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
    .btn { padding: 14px 32px; border: none; border-radius: 6px; font-size: 18px; font-weight: 700; background: #9146FF; color: white; cursor: pointer; }
    .grid { padding: 30px 60px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .stream { background: #18181B; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.3s; }
    .stream:hover { transform: scale(1.02); }
    .thumb { aspect-ratio: 16/9; background: linear-gradient(135deg, #2a1a4a, #0E0E10); position: relative; }
    .live-tag { position: absolute; top: 10px; left: 10px; background: red; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .info { padding: 12px; }
    .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .streamer { font-size: 12px; color: #9146FF; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Twitch</div>
    <a href="../index.html" class="back">← Voltar</a>
  </div>
  <div class="live">
    <h1>Lives ao vivo</h1>
    <p>Assista aos seus streamers favoritos em tempo real.</p>
    <button class="btn">📺 Ver todas as lives</button>
  </div>
  <div class="grid">
    <div class="stream">
      <div class="thumb"><div class="live-tag">AO VIVO</div></div>
      <div class="info"><div class="title">Streamer jogando GTA V</div><div class="streamer">@streamer1 • 25.4K viewers</div></div>
    </div>
    <div class="stream">
      <div class="thumb"><div class="live-tag">AO VIVO</div></div>
      <div class="info"><div class="title">Just Chatting</div><div class="streamer">@streamer2 • 8.2K viewers</div></div>
    </div>
    <div class="stream">
      <div class="thumb"><div class="live-tag">AO VIVO</div></div>
      <div class="info"><div class="title">League of Legends</div><div class="streamer">@proplayer • 15.7K viewers</div></div>
    </div>
    <div class="stream">
      <div class="thumb"><div class="live-tag">AO VIVO</div></div>
      <div class="info"><div class="title">Minecraft multiplayer</div><div class="streamer">@builder • 5.1K viewers</div></div>
    </div>
  </div>
</body>
</html>
